<!doctype html>
<html lang="en">
  <head>
  <meta name="viewport" content="initial-scale=1.0, user-scalable=no" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <style type="text/css">
      html { height: 100% }
      body { height: 100%; margin: 0; padding: 0 }
      #map_canvas { height: 100% }
  </style>
  <meta charset="utf-8">
  <link rel="stylesheet" href="http://cdn.jsdelivr.net/ol3/3.8.2/ol.css" type="text/css">
  <script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?version=4.8.0&features=requestAnimationFrame,Element.prototype.classList,URL"></script>
  <script src="http://cdn.jsdelivr.net/ol3/3.8.2/ol.js"></script>
  </head>
  <body>
    <div id="map_canvas" class="map" style ="width:100%;height:100%"></div>
    <script type="text/javascript">
      var center_lat = 127.41;
      var center_lon = 37.22;
      var markers = [];
      var map = new ol.Map({
 controls: ol.control.defaults({
          //zoom: false,
          attribution: false,
          rotate: false
        }),
 
        interactions : ol.interaction.defaults({
 //doubleClickZoom :false,
  keyboard: false,
          altShiftDragRotate: false
 }),
        target: 'map_canvas',
        layers: [
          new ol.layer.Tile({
            source: new ol.source.XYZ({
              url: 'http://a.tile.openstreetmap.org/{z}/{x}/{y}.png',
              tileSize: 256,
            })
          })
        ],
        view: new ol.View({
          center: ol.proj.fromLonLat([center_lat, center_lon]),
          zoom: 14
        })
      });
 var iconStyle = new ol.style.Style({
      image: new ol.style.Icon(/** @type {olx.style.IconOptions} */({
          anchor: [0.5, 1],
   offset: [0, 0],
   //scale: 0.08,
   opacity: 1.0,
          //src: 'https://openlayers.org/en/v5.2.0/examples/data/geolocation_marker.png'
         //src: 'map_pin2.png'

         scale: 1.0,
         src: 'marker_red3.png'
         //src: 'http://openlayers.org/api/img/marker.png'
         //src: 'marker_ol_red.png'
      }))
 });
 var markerSourceIcon = new ol.source.Vector();
 var markerVectorIcon = new ol.layer.Vector({
          source: markerSourceIcon,
       });
 

 var markerSource = new ol.source.Vector();
 var markStyle = new ol.style.Style({
  stroke: new ol.style.Stroke({
   color: '#ffcc33',
   width: 2
  }),
   fill: new ol.style.Fill({
   color: 'rgba(255,0,0,0.2)'
  }),
  image: new ol.style.Circle({
                    radius: 3,
              fill: new ol.style.Fill({
                        //color: '#2E10ff',
                        //opacity: 0.5,
                        color: 'rgba(46,16,255,0.5)'
                    })
              })
        });
 var markerVectorLayer = new ol.layer.Vector({
          source: markerSource,
          style: markStyle
       });
  map.addLayer(markerVectorLayer);
 map.addLayer(markerVectorIcon);

 function addInteractions( x, y, redraw){
  if(redraw == '1')
  {
   //window.alert(markers.length);
   //markerVectorLayer.getSource().removeFeature(markers);
   for (var i=0; i < markers.length; i++){
    //markers[i].clear();
   }
   markerSource.clear();
   markers = [];
   //window.alert(markers.length);
   return;
  }
  
  //tracking draw
  var geometry = new ol.geom.Point(ol.proj.fromLonLat([x, y]));
  var marker = new ol.Feature({
    geometry: geometry
  });
  markerSource.addFeature(marker);
  markers.push(marker);
  //marker draw
  markerSourceIcon.clear();
  var markerIcon = new ol.Feature({
    geometry: geometry
  });
  markerIcon.setStyle(iconStyle);
  markerSourceIcon.addFeature(markerIcon);
 }
 function DrawCurrent(x, y, redraw) {
     try {
  var lat = parseFloat(x);
  var lon = parseFloat(y);
  //window.alert("x:" + x + "   y:" + y);
  var projection = map.getView().getProjection(); 
  var lonlat = ol.proj.transform([lat, lon],'EPSG:4326', projection);
  //window.alert(lonlat);
  map.getView().setCenter(lonlat); //map move
  addInteractions(lat, lon, redraw);
     } catch (e) {
     }
  }
  
 var dn = 0, pre_move = 0;
 var move = 0;
 var last;
 document.addEventListener("click", function (e) {
  //window.alert(map.getCoordinateFromPixel(map.getEventPixel(e)));
  if(pre_move == 0){
   //var lonlat = map.getCoordinateFromPixel(map.getEventPixel(e));
   //map.getView().setCenter(lonlat);
  }
  pre_move = 0;
  //window.alert("x:" + e.pageX + " y: " + e.pageY + " w: " + document.getElementById('map_canvas').offsetWidth / 2 + " h: " + document.getElementById('map_canvas').offsetHeight / 2);
       });
       

 document.addEventListener("mousemove", function (e) {
  if(dn == 1 && (e.pageX != last.pageX || e.pageY != last.pageY)){
   var cur = map.getEventPixel(e);
   var pre = map.getEventPixel(last)
   var delta = [0, 0];
   
    delta[0] = cur[0] - pre[0];
    delta[1] = cur[1] - pre[1];
    
    if (delta[0] !== 0 || delta[1] !== 0) {
         var center = /** @type {import("./coordinate.js").Coordinate} */ (map.getView().getCenter());
         var centerPx = map.getPixelFromCoordinate(center);
         var newCenterPx = [
          centerPx[0] - delta[0],
          centerPx[1] - delta[1]
        ];
         
         var coordinates = map.getCoordinateFromPixel(newCenterPx);
        map.getView().setCenter(coordinates);
   }
   last = e;
   pre_move = move = 1;
   
  }
  else
   move = 0;
       });
 document.addEventListener("mousedown", function (e) {
  dn = 1;
  pre_dn = 1;
  last = e;
       });
 document.addEventListener("mouseup", function (e) {
  dn = 0;
  move = 0;
       });

 map.on('pointerdrag', function (e) {
  
      //window.alert(e);
 });
    </script>
  </body>
</html>
