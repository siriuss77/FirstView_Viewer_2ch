<HTML>
<HEAD>
<meta name="viewport" content="initial-scale=1.0, user-scalable=no" />
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<style type="text/css">
    html { height: 100% }
    body { height: 100%; margin: 0; padding: 0 }
    #map_canvas { height: 100% }
</style>

<script type="text/javascript">
    var map;
    var Point;
    var oldPoint;
    var Tracker;
    var lineCoordinatesPath;
    var markers = [];

    function initialize() {
        Point = new google.maps.LatLng(0, 0);
        var mapOptions = {
            center: Point,
            zoom: 15,
            panControl: false,
            zoomControl: true,
            zoomControlOptions: { style: google.maps.ZoomControlStyle.SMALL },
            mapTypeControl: true,
            scaleControl: false,
            streetViewControl: false,
            overviewMapControl: false,
            //disableDoubleClickZoom: true,
            mapTypeId: google.maps.MapTypeId.ROADMAP //HYBRID
        };
        map = new google.maps.Map(document.getElementById("map_canvas"), mapOptions);

        Tracker = new google.maps.Marker({
            position: Point,
            map: map,
            clickable: false
        });



        lineCoordinatesPath = new google.maps.Polyline({ //Polyline
        	 strokeColor: '#2E10FF',
        	 strokeOpacity: 0.0,
        	 strokeWeight: 4
        });
        
        lineCoordinatesPath.setMap(map);
    }

		function pushCoordToPath(point, redraw) {
			var path = lineCoordinatesPath.getPath();
			if(redraw == '1')
			{
				for (var i=0; i < markers.length; i++){
					markers[i].setMap(null);
				}
				setMapOnAll(null);
				markers = [];
				
				path.clear();
			}
				
			path.push(point);
			
			// Add a new marker at the new plotted point on the polyline.
			  var marker = new google.maps.Marker({
			    position: point,
			    icon: {
			      path: google.maps.SymbolPath.CIRCLE,
			      strokeColor: '#2E10FF',
			      strokeWeight: 3, 
                              strokeOpacity: 0.5, 
			      scale: 2
			    },
//			    title: '#' + t\path.getLength(),
			    map: map
			  });
				markers.push(marker);
		}
		
    function DrawCurrent(x, y, redraw) {
        try {
            Point = new google.maps.LatLng(y, x);
            
            pushCoordToPath(Point, redraw);
            
            Tracker.setPosition(Point);
            map.panTo(Point);
            oldPoint = Point;
        } catch (e) {
        }
    }

    function loadScript() {
        var script = document.createElement("script");
        script.type = "text/javascript";
 
        script.src = "http://maps.google.com/maps/api/js?&sensor=false&callback=initialize";
<!--    script.src = "http://maps.google.com/maps/api/js?v=3.13&sensor=false&callback=initialize"; -->
        document.body.appendChild(script);
    } 


</script>
</HEAD>
<BODY style="border:0; overflow:hidden;" scroll=no topmargin=0 leftmargin=0 "overflow:hidden" onload="loadScript()">
 <div id="map_canvas" style ="width:100%;height:100%"></div>
</BODY>
</HTML>
