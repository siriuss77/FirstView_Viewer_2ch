<HTML>
<HEAD>
<meta name="viewport" content="initial-scale=1.0, user-scalable=no" />
<style type="text/css">
    html { height: 100% }
    body { height: 100%; margin: 0; padding: 0 }
    #map_canvas { height: 100% }
</style>

<script type="text/javascript">
    var map;
    var Point;
    var oldPoint;
    var Tracker;

    function initialize() {
        Point = new google.maps.LatLng(0, 0);
        var mapOptions = {
            center: Point,
            zoom: 17,
            panControl: true,
            zoomControl: true,
            zoomControlOptions: { style: google.maps.ZoomControlStyle.SMALL },
            mapTypeControl: true,
            scaleControl: false,
            streetViewControl: false,
            overviewMapControl: false,
            mapTypeId: google.maps.MapTypeId.ROADMAP
        };
        map = new google.maps.Map(document.getElementById("map_canvas"), mapOptions);

        Tracker = new google.maps.Marker({
            position: Point,
            map: map,
            clickable: false
        });
    }

    function DrawCurrent(x, y) {
        try {
            Point = new google.maps.LatLng(y, x);
            
            Tracker.setPosition(Point);
            map.panTo(Point);
            oldPoint = Point;
        } catch (e) {
        }
    }

    function loadScript() {
        var script = document.createElement("script");
        script.type = "text/javascript";
        script.src = "http://maps.google.com/maps/api/js?sensor=false&callback=initialize";
        document.body.appendChild(script);
    } 


</script>
</HEAD>
<BODY scroll=no topmargin=0 leftmargin=0 "overflow:hidden" onload="loadScript()">
 <div id="map_canvas" style ="width:100%;height:100%"></div>
</BODY>
</HTML>
