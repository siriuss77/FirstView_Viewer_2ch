<?xml version="1.0" encoding="utf-8"?>
<!-- Please edit this xml in Visual studio -->
<clviewer>
  <configs>
    <!-- choose one only-->
    <!--language>english</language-->
    <language>korean</language>
    <!--language>japanese</language-->
    <!--language mode="0">chinese</language-->
    <!--language mode="1">chinese</language-->
    <!--language>russian</language-->
    <dirs><!--You have to make 100%.-->
      <dir type="NORMAL" nxfsp="50">INFINITE</dir>
      <dir type="EVENT" nxfsp="20">EVENT</dir>
      <dir type="MOTION" nxfsp="20">MOTION</dir>
      <dir type="MANUAL" nxfsp="10">SELECT</dir>
    </dirs>
    <extensions>
      <extension>avi</extension>
      <extension>mp4</extension>
      <extension>enc</extension>
    </extensions>
    <recursive removal="true" desktop="false"/>
    <capture filetime="true" addpos="true"/>
  </configs>
